[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "hw3-calvin-act"
version = "0.1.0"
description = "LeRobot ACT experiments for CALVIN cross-environment generalization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<2.3",
    "PyYAML>=6.0",
    "swanlab>=0.7,<0.8",
    "torch>=2.7,<2.11",
    "torchvision>=0.22,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"

[tool.ruff]
line-length = 110
target-version = "py312"
